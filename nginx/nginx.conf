worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    server {
        listen 3000;
        server_name _;

        root /var/www;
        index index.html;

        # Universal Links / App Links association files.
        # Apple requires apple-app-site-association to be served as
        # application/json with a 200 and NO redirect. The file has no
        # extension, so without this block nginx would send it as
        # application/octet-stream. try_files ... =404 keeps these files
        # off the SPA index.html fallback.
        location /.well-known/ {
            default_type application/json;
            add_header Content-Type application/json;
            try_files $uri =404;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache hashed static assets (Vite adds content hashes to filenames)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
